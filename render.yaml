services:
  - type: web
    name: zm-reporting-mcp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: AUTHKIT_DOMAIN
        sync: false
      - key: PUBLIC_URL
        sync: false
